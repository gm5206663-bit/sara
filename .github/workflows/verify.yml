name: verify

# The repository checks itself on every push — the house contract:
#   1. every tracked file hash-matches MANIFEST.sha256
#   2. every relative markdown link resolves
#   3. the self-file's own shape holds (tools/check_sara.py)
# A red run means one of those broke — fix the file, refresh the manifest
# (sh tools/refresh-manifest.sh), commit both together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify the repository against itself
        run: python3 tools/check.py
      - name: The self-file's shape (ledger, name, identity)
        run: python3 tools/check_sara.py
